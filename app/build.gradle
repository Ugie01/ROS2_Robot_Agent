plugins {
    alias(libs.plugins.android.application)
}

Properties properties = new Properties()
def localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}

android {
    namespace 'com.example.robot_agent'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.robot_agent"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // DDS Native C++/JNI 바이너리 아키텍처 설정
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        buildConfigField "String", "GEMINI_API_KEY", "\"${properties.getProperty('GEMINI_API_KEY', '')}\""

        // OLLAMA URL (local.properties에 없으면 기본 127.0.0.1 사용)
        buildConfigField "String", "OLLAMA_URL", "\"${properties.getProperty('OLLAMA_URL', '')}\""

        // PICOVOICE (키가 없으면 빈 문자열 "" 주입)
        buildConfigField "String", "PICOVOICE_ACCESS_KEY", "\"${properties.getProperty('PICOVOICE_ACCESS_KEY', '')}\""
    }

    buildFeatures {
        buildConfig true // BuildConfig 활성화
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // ROS 2 Native DDS 라이브러리 (Fast-DDS)
    implementation 'us.ihmc:jros2-android:1.5.1'

    // Picovoice Porcupine 온디바이스 핫워드 감지 엔진
    implementation 'ai.picovoice:porcupine-android:3.0.2'

    // REST 통신용 OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JNA (Vosk가 C++ 기반이라 필요함)
    implementation 'net.java.dev.jna:jna:5.18.1@aar'

    // Vosk Android 라이브러리 (이 부분 스펠링 수정됨!)
    implementation 'com.alphacephei:vosk-android:0.3.32@aar'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}